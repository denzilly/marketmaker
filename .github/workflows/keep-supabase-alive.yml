name: Keep Supabase Alive

on:
  schedule:
    # Daily at 09:00 UTC - well within Supabase's 7-day free-tier pause window
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret shape (no values printed)
        run: |
          echo "SUPABASE_URL length: ${#SUPABASE_URL}"
          echo "SUPABASE_ANON_KEY length: ${#SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Ping Supabase REST API
        run: |
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n')
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${url}/rest/v1/markets?select=id&limit=1" \
            -H "apikey: ${key}" \
            -H "Authorization: Bearer ${key}")
          echo "Response status: $status"
          if [ "$status" -ge 400 ]; then
            echo "Ping failed with status $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
