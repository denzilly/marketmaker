name: Keep Supabase Alive

on:
  schedule:
    # Daily at 09:00 UTC - well within Supabase's 7-day free-tier pause window
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret shape (no values printed)
        run: |
          echo "MARKETMAKER length: ${#MARKETMAKER}"
          echo "MARKETMAKER line count: $(printf '%s' "$MARKETMAKER" | wc -l)"
        env:
          MARKETMAKER: ${{ secrets.MARKETMAKER }}

      - name: Ping Supabase REST API
        run: |
          url=$(printf '%s\n' "$MARKETMAKER" | sed -n '1p' | tr -d '\r')
          key=$(printf '%s\n' "$MARKETMAKER" | sed -n '2p' | tr -d '\r')
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${url}/rest/v1/markets?select=id&limit=1" \
            -H "apikey: ${key}" \
            -H "Authorization: Bearer ${key}")
          echo "Response status: $status"
          if [ "$status" -ge 400 ]; then
            echo "Ping failed with status $status"
            exit 1
          fi
        env:
          MARKETMAKER: ${{ secrets.MARKETMAKER }}
